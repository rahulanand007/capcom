openapi: 3.1.0
info:
  title: Capcom API
  version: 0.1.0
  description: |
    Runtime-agnostic AgentOps control-plane API.

    All `/v1/*` endpoints require `Authorization: Bearer <CAPCOM_ADMIN_TOKEN>`; only
    `GET /healthz` is unauthenticated. Browser clients on a different origin (the Next.js
    console) are supported via CORS: the allowed origins are configured with
    `CAPCOM_CORS_ALLOWED_ORIGINS` (default `http://localhost:3000,http://127.0.0.1:3000`),
    and preflight `OPTIONS` requests return `204` without requiring admin auth.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/secrets:
    post:
      summary: Store an encrypted secret
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          description: Secret stored; the value is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMetadata"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/secrets/{name}:
    put:
      summary: Rotate an encrypted secret
      operationId: rotateSecret
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateSecretRequest"
      responses:
        "200":
          description: Secret rotated; the value is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMetadata"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections:
    post:
      summary: Create a runtime connection
      operationId: createRuntimeConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuntimeConnectionRequest"
      responses:
        "201":
          description: Runtime connection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnection"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    get:
      summary: List runtime connections
      operationId: listRuntimeConnections
      responses:
        "200":
          description: Runtime connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeConnection"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}:
    get:
      summary: Get a runtime connection
      operationId: getRuntimeConnection
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Runtime connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnection"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update mutable runtime instance settings
      operationId: updateRuntimeInstanceSettings
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuntimeInstanceSettingsRequest"
      responses:
        "200":
          description: Updated runtime instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove a runtime instance from active operation
      description: Soft-removes the instance while retaining imported state and audit history.
      operationId: removeRuntimeInstance
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveRuntimeInstanceRequest"
      responses:
        "204":
          description: Runtime instance removed
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}/test:
    post:
      summary: Test a runtime connection through its adapter
      operationId: testRuntimeConnection
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Runtime connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnectionTestResult"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}/agents:
    get:
      summary: Read live agents through the selected runtime adapter
      operationId: listRuntimeAgents
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Runtime-normalized live agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAgent"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}/agents/{agentID}/access:
    get:
      summary: Read a live agent access document through the runtime adapter
      operationId: getRuntimeAgentAccess
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: agentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runtime-normalized agent access document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAgentAccess"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}/agents/{agentID}/skills:
    get:
      summary: Read current skill bindings through the runtime adapter
      operationId: listRuntimeAgentSkills
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: agentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runtime-normalized current agent skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAgentSkill"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}/sync:
    post:
      summary: Run a complete durable runtime synchronization
      operationId: syncRuntimeConnection
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRuntimeRequest"
      responses:
        "200":
          description: Completed synchronization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSyncRun"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/runtime-connections/{id}/sync-runs:
    get:
      summary: List synchronization history
      operationId: listRuntimeSyncRuns
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Synchronization history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeSyncRun"
  /v1/runtime-connections/{id}/sync-runs/{runID}:
    get:
      summary: Get one synchronization run
      operationId: getRuntimeSyncRun
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: runID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Synchronization run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSyncRun"
        "404":
          $ref: "#/components/responses/Error"
  /v1/runtime-instances:
    $ref: "#/paths/~1v1~1runtime-connections"
  /v1/runtime-instances/{id}:
    $ref: "#/paths/~1v1~1runtime-connections~1{id}"
  /v1/runtime-instances/{id}/test:
    $ref: "#/paths/~1v1~1runtime-connections~1{id}~1test"
  /v1/runtime-instances/{id}/sync:
    $ref: "#/paths/~1v1~1runtime-connections~1{id}~1sync"
  /v1/runtime-instances/{id}/sync-runs:
    $ref: "#/paths/~1v1~1runtime-connections~1{id}~1sync-runs"
  /v1/runtime-instances/{id}/endpoints/consolidate:
    post:
      summary: Consolidate a duplicate runtime connection as an endpoint route
      operationId: consolidateRuntimeEndpoint
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsolidateRuntimeEndpointRequest"
      responses:
        "200":
          description: Canonical runtime instance with updated endpoint topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/runtime-instances/{id}/agents:
    get:
      summary: List persisted agents belonging to one runtime instance
      operationId: listRuntimeInstanceAgents
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Instance-scoped persisted agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersistedAgent"
  /v1/runtime-instances/{id}/subagent-executions:
    get:
      summary: List ephemeral delegated executions belonging to one runtime instance
      operationId: listRuntimeInstanceSubagentExecutions
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Instance-scoped delegated execution observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubagentExecution"
  /v1/runtime-instances/{id}/executions:
    get:
      summary: List runtime-neutral executions belonging to one runtime instance
      operationId: listRuntimeInstanceExecutions
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: runtime_agent_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Instance-scoped runtime executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeExecution"
  /v1/runtime-instances/{id}/diagnostics:
    get:
      summary: List normalized runtime doctor checks
      operationId: listRuntimeDiagnostics
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Latest diagnostics for the runtime instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeDiagnostic"
  /v1/runtime-instances/{id}/inventory:
    get:
      summary: List normalized runtime inventory
      operationId: listRuntimeInventory
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - name: kind
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tools, skills, and MCP servers from the runtime instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeInventoryItem"
  /v1/runtime-instances/{id}/capabilities:
    get:
      summary: List normalized approved runtime capabilities
      operationId: listRuntimeCapabilities
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Immutable capability manifests from the runtime instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeCapability"
  /v1/runtime-instances/{id}/agent-delegations:
    get:
      summary: List durable agent delegation relationships for one runtime instance
      operationId: listRuntimeInstanceAgentDelegations
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Directed callable-agent relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentDelegation"
  /v1/runtime-instances/{id}/metrics:
    get:
      summary: Get usage metrics for one runtime instance
      operationId: getRuntimeInstanceMetrics
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
        - $ref: "#/components/parameters/MetricsFrom"
        - $ref: "#/components/parameters/MetricsTo"
        - $ref: "#/components/parameters/MetricsInterval"
        - $ref: "#/components/parameters/MetricsSource"
      responses:
        "200":
          description: Preferred-source runtime metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
  /v1/runtime-instances/{id}/telemetry-health:
    get:
      summary: Get latest telemetry connector health
      operationId: getRuntimeInstanceTelemetryHealth
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Latest ingestion status or not-configured state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryHealth"
  /v1/runtime-instances/{id}/live/agents:
    get:
      summary: Read live agents through one runtime instance adapter
      operationId: listRuntimeInstanceLiveAgents
      parameters:
        - $ref: "#/components/parameters/RuntimeConnectionID"
      responses:
        "200":
          description: Runtime-normalized live agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAgent"
  /v1/runtime-instances/{id}/live/agents/{agentID}/skills:
    $ref: "#/paths/~1v1~1runtime-connections~1{id}~1agents~1{agentID}~1skills"
  /v1/runtime-instances/{id}/live/agents/{agentID}/access:
    $ref: "#/paths/~1v1~1runtime-connections~1{id}~1agents~1{agentID}~1access"
  /v1/agents:
    get:
      summary: List persisted runtime agents with freshness metadata
      operationId: listAgents
      parameters:
        - name: runtime_connection_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Persisted agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersistedAgent"
  /v1/agents/{id}:
    get:
      summary: Get one persisted agent
      operationId: getAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persisted agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistedAgent"
  /v1/agents/{id}/metrics:
    get:
      summary: Get usage metrics for one persisted agent
      operationId: getAgentMetrics
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/MetricsFrom"
        - $ref: "#/components/parameters/MetricsTo"
        - $ref: "#/components/parameters/MetricsInterval"
        - $ref: "#/components/parameters/MetricsSource"
      responses:
        "200":
          description: Preferred-source agent metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
  /v1/metrics/summary:
    get:
      summary: Get fleet usage metrics
      operationId: getMetricsSummary
      parameters:
        - $ref: "#/components/parameters/MetricsFrom"
        - $ref: "#/components/parameters/MetricsTo"
        - $ref: "#/components/parameters/MetricsInterval"
        - $ref: "#/components/parameters/MetricsSource"
      responses:
        "200":
          description: Preferred-source fleet metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
  /v1/telemetry/otlp/v1/traces:
    post:
      summary: Ingest authenticated OTLP/HTTP JSON traces
      operationId: ingestOTLPTraces
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          application/x-protobuf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Ingestion counts
  /v1/agents/{id}/access:
    get:
      summary: Get persisted effective access
      operationId: getAgentAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persisted access document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAgentAccess"
  /v1/agents/{id}/skills:
    get:
      summary: Get persisted assigned skills
      operationId: getAgentSkills
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persisted assigned skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAgentSkill"
  /v1/agents/{id}/delegations:
    get:
      summary: List outgoing and incoming durable delegation relationships for one agent
      operationId: listAgentDelegations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Directed relationships involving the selected agent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentDelegation"
  /v1/agents/{id}/actions/reconcile-access:
    post:
      summary: Validate or replace an agent access document
      operationId: reconcileAgentAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileAccessRequest"
      responses:
        "200":
          description: Control action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAction"
        "400":
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/actions/set-status:
    post:
      summary: Validate or change an agent lifecycle status
      operationId: setAgentStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAgentStatusRequest"
      responses:
        "200":
          description: Audited control action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAction"
        "400":
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/actions/delete:
    post:
      summary: Validate or delete a runtime agent
      operationId: deleteAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAgentRequest"
      responses:
        "200":
          description: Audited control action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAction"
        "400":
          $ref: "#/components/responses/Error"
  /v1/subagent-executions:
    get:
      summary: List observed ephemeral subagent executions
      operationId: listSubagentExecutions
      parameters:
        - name: runtime_connection_id
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Delegated execution observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubagentExecution"
  /v1/runtime-executions:
    get:
      summary: List runtime-neutral execution observations
      operationId: listRuntimeExecutions
      parameters:
        - name: runtime_connection_id
          in: query
          schema:
            type: string
        - name: runtime_agent_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Runtime execution observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeExecution"
  /v1/runtime-executions/{id}/actions/cancel:
    post:
      summary: Validate or cancel an active runtime execution
      operationId: cancelRuntimeExecution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelExecutionRequest"
      responses:
        "200":
          description: Audited control action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAction"
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Capcom admin token
  parameters:
    RuntimeConnectionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    MetricsFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    MetricsTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    MetricsInterval:
      name: interval
      in: query
      schema: { type: string, enum: [5m, 15m, 1h, 6h, 1d], default: 1h }
    MetricsSource:
      name: source
      in: query
      schema: { type: string, enum: [gantry_native, langsmith, otel] }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: capcom
        version:
          type: string
          example: dev
    CreateRuntimeConnectionRequest:
      type: object
      required: [name, runtime_type, mode, endpoint, auth_ref, actor, reason]
      properties:
        name:
          type: string
          example: gantry-development
          description: Stable unique instance key.
        display_name:
          type: string
          example: Gantry Development
        environment:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,31}$"
          example: development
        labels:
          type: object
          additionalProperties:
            type: string
        runtime_type:
          type: string
          enum: [gantry, langgraph]
        mode:
          type: string
          enum: [read_only, control_enabled]
        endpoint:
          type: string
          format: uri
          example: http://127.0.0.1:8787
        auth_ref:
          type: string
          example: gantry-control-api-key
        actor:
          type: string
          example: local-dev
        reason:
          type: string
          example: initial Gantry connection
        description:
          type: string
    RuntimeConnection:
      type: object
      required: [id, name, display_name, environment, labels, runtime_type, mode, status, endpoint, endpoints, auth_ref, created_at, updated_at, sync_enabled, sync_interval_seconds]
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        environment:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
        runtime_type:
          type: string
          enum: [gantry, langgraph]
